// build.gradle cho sub-project 1.17.1-forge
// Forge 37.x cho Minecraft 1.17.1
// Lưu ý: 1.17.1 đã dùng Java 17 nhưng có 1 số API khác biệt so với 1.18+

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0+mc1.17.1'
group = 'com.lowendboost'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.17.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.enabledGameTestNamespaces', 'lowendboost'
            mods {
                lowendboost { source sourceSets.main }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', 'lowendboost' }
        server { property 'forge.enabledGameTestNamespaces', 'lowendboost' }
    }
}

dependencies {
    implementation project(':common')
    minecraft "net.minecraftforge:forge:1.17.1-37.1.1"
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'lowendboost',
            'Specification-Vendor'  : 'lowendboost',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
    from sourceSets.main.resources
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        resources {
            srcDirs = ['src/main/resources']
            srcDirs += project(':common').file('src/main/resources')
        }
    }
}

jar.finalizedBy('reobfJar')

processResources {
    filesMatching('META-INF/mods.toml') {
        expand 'mod_id': 'lowendboost',
               'mod_name': 'LowEndBoost',
               'mod_license': 'MIT',
               'mod_version': '1.0.0',
               'mod_authors': 'LowEndBoost Team',
               'mod_description': 'Performance optimization mod for low-end laptops. Tăng FPS cho máy yếu.',
               'minecraft_version': '1.17.1',
               'loader_version_range': '[37,)'
    }
}
