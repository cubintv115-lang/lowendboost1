modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]] #optional
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# OptiFine là tùy chọn, không bắt buộc - mod vẫn chạy nếu không có OptiFine
[[dependencies.${mod_id}]]
    modId="optifine"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="CLIENT"
