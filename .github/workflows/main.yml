# GitHub Actions workflow để tự động build mod LowEndBoost
# Tối ưu cho mạng chậm và cache lỗi

name: Build Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Tự tải Gradle thay vì dùng setup-gradle (cache lỗi)
      - name: Download Gradle 8.1.1
        run: |
          echo "Downloading Gradle 8.1.1..."
          for i in 1 2 3; do
            if wget -q -O gradle-8.1.1-bin.zip https://services.gradle.org/distributions/gradle-8.1.1-bin.zip; then
              echo "Downloaded successfully"
              break
            fi
            echo "Retry $i..."
            sleep 5
          done
          unzip -q gradle-8.1.1-bin.zip
          ls -la gradle-8.1.1/bin/

      - name: Generate gradle-wrapper.jar
        run: ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Build với retry và thêm timeout
      - name: Build all MC versions
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if ./gradlew build --no-daemon --no-build-cache --info; then
              echo "Build successful!"
              break
            fi
            echo "Build failed, retrying in 30s..."
            sleep 30
          done
        timeout-minutes: 60

      - name: Upload 1.20.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.20.1
          path: versions/1.20.1-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 1.19.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.19.2
          path: versions/1.19.2-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 1.18.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.18.2
          path: versions/1.18.2-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 1.17.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.17.1
          path: versions/1.17.1-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versions/1.20.1-forge/build/libs/lowendboost-*.jar
            versions/1.19.2-forge/build/libs/lowendboost-*.jar
            versions/1.18.2-forge/build/libs/lowendboost-*.jar
            versions/1.17.1-forge/build/libs/lowendboost-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
