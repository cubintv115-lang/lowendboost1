# GitHub Actions workflow để tự động build mod LowEndBoost
name: Build Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate gradle-wrapper.jar
        run: gradle wrapper --gradle-version 8.1.1

      - name: Build all MC versions
        run: ./gradlew build --no-daemon
        continue-on-error: false

      - name: Upload 1.20.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.20.1
          path: versions/1.20.1-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 1.19.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.19.2
          path: versions/1.19.2-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 1.18.2 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.18.2
          path: versions/1.18.2-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Upload 1.17.1 JAR
        uses: actions/upload-artifact@v4
        with:
          name: lowendboost-1.17.1
          path: versions/1.17.1-forge/build/libs/lowendboost-*.jar
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versions/1.20.1-forge/build/libs/lowendboost-*.jar
            versions/1.19.2-forge/build/libs/lowendboost-*.jar
            versions/1.18.2-forge/build/libs/lowendboost-*.jar
            versions/1.17.1-forge/build/libs/lowendboost-*.jar
          draft: false
          prerelease: false
          generate_release_notes: true
