# Gradle properties cho LowEndBoost
# Cấu hình chung cho toàn bộ project

# JVM args khi chạy Minecraft client từ Gradle
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8

# Bật build cache & parallel execution
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# Mod info
mod_id=lowendboost
mod_name=LowEndBoost
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.lowendboost
mod_authors=LowEndBoost Team
mod_description=Performance optimization mod for low-end laptops. Tăng FPS cho máy yếu.
