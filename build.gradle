// build.gradle (root) - Cấu hình chung cho cả multi-project
// Plugin Forge chỉ được apply trong từng sub-project, KHÔNG ở đây.

allprojects {
    group = 'com.lowendboost'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
}
